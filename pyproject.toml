[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[project]
name = "softverse"
version = "2.0.0.dev0"
description = "Auto-compute Citations to Software From Replication Files"
authors = [
    {name = "Gaurav Sood", email = "gsood07@gmail.com"},
    {name = "Daniel Weitzel"}
]
readme = "readme.md"
license = {text = "MIT"}
homepage = "https://github.com/recite/softverse"
repository = "https://github.com/recite/softverse"
documentation = "https://recite.github.io/softverse/"
keywords = ["research", "software", "citations", "replication", "dataverse", "zenodo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=18.0.0",
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "tree-sitter>=0.25.0",
    "tree-sitter-language-pack>=1.14.0",
    "nbformat>=5.10.0",
    "charset-normalizer>=3.4.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "tomli-w>=1.0.0",
    "stamina>=26.1.0",
    "pyrate-limiter>=4.4.0",
    "zenodo-client>=0.4.2",
    "pydataverse>=0.3.5",
    "py7zr>=1.1.3",
    "tabulate>=0.10.0",
    "rarfile>=4.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.14.6",
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "pre-commit>=2.20.0",
    "sphinx>=5.0.0",
    "furo>=2022.6.21",
    "myst-parser>=4.0.0",
]

[project.scripts]
softverse = "softverse.cli:cli"

[dependency-groups]
dev = [
    "ruff>=0.14.6",
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "pre-commit>=2.20.0",
    "sphinx>=5.0.0",
    "furo>=2022.6.21",
    "myst-parser>=4.0.0",
    "twine>=6.2.0",
    "matplotlib>=3.11.1",
]


[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "archive/",
    "temp/",
    "logs/",
    "debug_*.py",
    "monitor_*.py",
    "test_icpsr_download.py"
]

[tool.ruff.lint]
# Enable flake8 equivalents + additional rules
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E203",  # whitespace before ':' (conflicts with black)
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

["F401"]  # imported but unused
"softverse/analyzers/import_analyzer.py" = ["E501"]  # long lines in R code templates

[tool.ruff.lint.isort]
known-first-party = ["softverse"]
split-on-trailing-comma = true

[tool.uv.build-backend]
module-name = "softverse"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=softverse --cov-report=term-missing -q"
