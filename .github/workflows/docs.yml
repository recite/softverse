name: Documentation

on:
  push:
    branches: [main, v2-rebuild]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # The branches that publish. A pull request builds the site and checks it,
  # and deploys nothing.
  DEPLOY: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v2-rebuild' }}

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      # `make site` and nothing else, so a site that builds here builds the
      # same way on a laptop. It reads only the tracked tables under
      # `build/release/tally/`; the collected corpus is not in this checkout.
      - name: Build the site
        run: make site

      - name: Setup Pages
        if: env.DEPLOY == 'true'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: env.DEPLOY == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy-docs:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v2-rebuild'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
