name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly: surface ecosystem drift on quiet repos

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: gojiplus/py-canon/.github/workflows/reusable-ci.yml@v1
    with:
      wheel-import: softverse
      coverage-floor: 0
      # Wider than the canon default of floor-and-ceiling on ubuntu alone.
      # This package parses source with `ast` and `tree-sitter` and lexes
      # Stata by hand, so a grammar change between minor Pythons is a real
      # failure mode; and it reads deposit archives whose filenames arrive in
      # whatever encoding the author's machine used, which is where macOS and
      # Linux disagree. `_preserve_ci_inputs` carries these across an adopt.
      python-versions: '["3.11", "3.12", "3.13", "3.14"]'
      os: '["ubuntu-latest", "macos-latest"]'
